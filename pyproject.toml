[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8.0", "wheel", "numpy>=1.18"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinytt*"]

[project]
name = "tinyTT"
version = "0.6"
description = "Tensor-Train decomposition on PyTorch — Riemannian manifold geometry, structure-exploiting solvers, functional TT surrogates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.18",
    "torch>=2.0",
]
license = {file = "LICENSE"}
authors = [
    { name = "Martin Eigel" }
]
maintainers = [
    { name = "Martin Eigel" }
]
keywords = ["pytorch", "tensor-train", "tt-decomposition", "riemannian-optimisation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/meigel/tinyTT"
Documentation = "https://meigel.github.io/tinyTT/"
Changelog = "https://github.com/meigel/tinyTT/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fem = ["scikit-fem"]
dev = ["pytest", "ruff", "scipy", "coverage", "scikit-fem"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
markers = [
    "fast: quick smoke tests intended for tight feedback loops",
    "slow: long-running integration or reference-quality tests",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["tinytt"]
omit = ["tests/*"]
# Branch coverage: both sides of every `if`, and loops that run to their
# iteration cap.  Statement coverage alone cannot see an untaken `else`.
branch = true

[tool.coverage.report]
# 100% of statements and branches, with tests that assert behaviour rather
# than chase lines.  Anything genuinely unreachable carries a
# `# pragma: no cover` / `# pragma: no branch` with the reason beside it.
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
