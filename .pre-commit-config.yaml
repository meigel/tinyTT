repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # match the ruff that CI installs; `ruff check .` is the enforced gate.
    # No ruff-format hook: the code base is not ruff-formatted (it would
    # rewrite 132 of 155 files), so the hook reformatted whatever a commit
    # touched and buried the real change in noise.
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
